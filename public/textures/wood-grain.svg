<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Procedural Wood Grain Filter -->
    <filter id="wood-grain" x="0%" y="0%" width="100%" height="100%">
      <!-- baseFrequency="X Y" stretches the noise vertically to simulate wood fibers -->
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.25" numOctaves="4" seed="15" result="noise" />
      
      <!-- Map the noise to an industrial hardwood color palette -->
      <feColorMatrix type="matrix" 
        values="0.4  0    0    0   0.3
                0.3  0.1  0    0   0.2
                0.2  0.05 0    0   0.1
                0    0    0    1   0" 
        in="noise" result="coloredNoise" />
    </filter>
  </defs>
  
  <!-- Base Wood Color (Silver Oak/Hardwood Tone) -->
  <rect width="100%" height="100%" fill="#a67b5b" />
  
  <!-- Overlay the generated wood grain -->
  <rect width="100%" height="100%" filter="url(#wood-grain)" opacity="0.85" style="mix-blend-mode: multiply;" />
</svg>
